name: Build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-parts/alpha2-a.b64'
      - 'source-parts/alpha2-b.b64'
      - 'source-parts/alpha4-tv-from-alpha2.patch.gz.b64.part00'
      - 'source-parts/alpha4-tv-from-alpha2.patch.gz.b64.part01'
      - 'source-parts/alpha5-integrated-tv.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          cat source-parts/alpha2-a.b64 source-parts/alpha2-b.b64 > source-alpha2.zip.b64
          base64 --decode source-alpha2.zip.b64 > source-alpha2.zip
          echo "b44ff1d70cc2bd7e231d12a2d1a6495e4091e98b3c000255066112e04c735ee7  source-alpha2.zip" | sha256sum --check
          unzip -t source-alpha2.zip
          unzip -q source-alpha2.zip
          python3 source-parts/alpha4-apply.py
          cat source-parts/alpha4-tv-from-alpha2.patch.gz.b64.part00 source-parts/alpha4-tv-from-alpha2.patch.gz.b64.part01 | base64 --decode | gzip --decompress > /tmp/alpha4-tv-ocr.patch
          patch --batch -d . -p1 < /tmp/alpha4-tv-ocr.patch
          python3 - <<'PY'
          from pathlib import Path
          for module in ("phone", "tv"):
              path = Path("GlossaWhaleOS") / module / "build.gradle.kts"
              source = path.read_text()
              source = source.replace("versionCode = 2", "versionCode = 4").replace("versionCode = 3", "versionCode = 4")
              source = source.replace("0.1.0-alpha2", "0.3.0-alpha4-ocr-translate")
              source = source.replace("0.2.0-alpha3-ocr-test", "0.3.0-alpha4-ocr-translate")
              source = source.replace("0.2.0-alpha3-ocr-bridge", "0.3.0-alpha4-ocr-translate")
              path.write_text(source)
          PY
          python3 - <<'PY'
          from pathlib import Path
          tv_source = Path("GlossaWhaleOS/tv/src/main/java/com/darkscorpion/glossasub/tv/TvActivity.kt")
          tv_source.write_text(tv_source.read_text().replace(r"\${", "${"))
          for module in ("phone", "tv"):
              path = Path("GlossaWhaleOS") / module / "build.gradle.kts"
              source = path.read_text()
              block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              if "sourceCompatibility = JavaVersion.VERSION_17" not in source:
                  source = source.replace("android {", block, 1)
                  path.write_text(source)
          PY

      - name: Integrate Chiaki Remote Play video-only OCR app
        run: python3 source-parts/alpha5-integrated-tv.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build phone and HDMI helper APKs
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          arguments: -p GlossaWhaleOS --no-daemon :phone:assembleDebug :tv:assembleDebug

      - name: Build Chiaki Remote Play OCR TV APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          arguments: -p remote/chiaki-ng-androidtv --no-daemon :app:assembleDebug

      - name: Upload all debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: GlossaWhaleOS-alpha5-debug-apks
          path: |
            GlossaWhaleOS/phone/build/outputs/apk/debug/*.apk
            GlossaWhaleOS/tv/build/outputs/apk/debug/*.apk
            remote/chiaki-ng-androidtv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
