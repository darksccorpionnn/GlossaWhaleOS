name: Build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-parts/alpha2-a.b64'
      - 'source-parts/alpha2-b.b64'
      - 'source-parts/alpha3-ocr-test.patch'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          cat source-parts/alpha2-a.b64 source-parts/alpha2-b.b64 > source-alpha2.zip.b64
          base64 --decode source-alpha2.zip.b64 > source-alpha2.zip
          echo "b44ff1d70cc2bd7e231d12a2d1a6495e4091e98b3c000255066112e04c735ee7  source-alpha2.zip" | sha256sum --check
          unzip -t source-alpha2.zip
          unzip -q source-alpha2.zip
          patch -d . -p1 < source-parts/alpha3-ocr-test.patch
          python3 - <<'PY'
          from pathlib import Path
          tv_source = Path("GlossaWhaleOS/tv/src/main/java/com/darkscorpion/glossasub/tv/TvActivity.kt")
          tv_source.write_text(tv_source.read_text().replace(r"\${", "${"))
          for module in ("phone", "tv"):
              path = Path("GlossaWhaleOS") / module / "build.gradle.kts"
              text = path.read_text()
              block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
                  text = text.replace("android {", block, 1)
                  path.write_text(text)
          PY
      - name: Inspect assembled source for Remote Play integration
        shell: bash
        run: |
          echo "=== SOURCE TREE ==="
          find GlossaWhaleOS -type f | sort
          echo "=== SOURCE CONTENTS ==="
          shopt -s globstar nullglob
          for f in GlossaWhaleOS/**/*.kt GlossaWhaleOS/**/*.java GlossaWhaleOS/**/AndroidManifest.xml GlossaWhaleOS/**/build.gradle.kts GlossaWhaleOS/**/settings.gradle.kts; do
            echo "===== FILE: $f ====="
            sed -n '1,500p' "$f"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build phone and TV APKs
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          arguments: -p GlossaWhaleOS --no-daemon :phone:assembleDebug :tv:assembleDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: GlossaWhaleOS-debug-apks
          path: |
            GlossaWhaleOS/phone/build/outputs/apk/debug/*.apk
            GlossaWhaleOS/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
