name: Prepare licensed English Turkish parallel corpus

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rdr2-tatoeba-sources.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download original Tatoeba language files (includes author metadata)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus
          curl --fail --location --retry 4 --connect-timeout 30 --max-time 480 -o corpus/eng_sentences_detailed.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences_detailed.tsv.bz2
          curl --fail --location --retry 4 --connect-timeout 30 --max-time 480 -o corpus/tur_sentences_detailed.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/tur/tur_sentences_detailed.tsv.bz2
          curl --fail --location --retry 4 --connect-timeout 30 --max-time 480 -o corpus/eng-tur_links.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/eng/eng-tur_links.tsv.bz2
          ls -lh corpus/
          sha256sum corpus/* > corpus/SHA256SUMS
          for f in corpus/*.bz2; do bzip2 -t "$f"; done
          cat > corpus/SOURCES.md <<'TEXT'
          Tatoeba weekly exports, downloaded during GitHub Actions run.
          https://downloads.tatoeba.org/exports/per_language/eng/
          https://downloads.tatoeba.org/exports/per_language/tur/
          License: CC BY 2.0 FR (attribution to original sentence authors required).
          https://tatoeba.org/en/downloads
          https://en.wiki.tatoeba.org/articles/show/using-the-tatoeba-corpus
          TEXT
      - uses: actions/upload-artifact@v4
        with:
          name: rdr2-tatoeba-attributed-sources
          path: corpus/
          if-no-files-found: error
          retention-days: 1
